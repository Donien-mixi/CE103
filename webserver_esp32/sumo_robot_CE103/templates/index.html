<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sumo Robot Debugger - UIT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a1a; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-top: 30px;
        }
        
        /* Layout chính - Đã chuyển thành hàng ngang (row) */
        .container { 
            display: flex; 
            flex-direction: row; /* Chia 2 cột trái - phải */
            justify-content: center;
            align-items: stretch; /* Kéo giãn cho 2 khối cao bằng nhau */
            gap: 30px; 
            width: 95%;
            max-width: 900px; /* Nới rộng để chứa 2 khối */
        }
        
        /* Khu vực Robot (Cột trái) */
        #robot-viewer { 
            background: #2a2a2a; 
            padding: 30px; 
            border-radius: 15px; 
            border: 2px solid #444; 
            position: relative; 
            display: flex;
            justify-content: center;
            flex: 1; /* Chiếm 1 nửa không gian */
        }
        
        /* Định nghĩa màu sắc cảm biến Laser (E3F) */
        .sensor { transition: fill 0.1s; fill: #444; stroke: #222; stroke-width: 1; }
        .sensor.active { fill: #ff3e3e; filter: drop-shadow(0 0 8px #ff3e3e); } 
        
        /* Định nghĩa màu sắc cảm biến vạch (Line) */
        .line-sensor { transition: fill 0.1s; fill: #555; rx: 1; }
        .line-sensor.active { fill: #ffff00; filter: drop-shadow(0 0 8px #ffff00); } 
        
        /* Bánh xe xoay */
        .wheel { fill: #111; transition: fill 0.1s; }
        .wheel.moving { fill: #00ff00; filter: drop-shadow(0 0 5px #00ff00); } 

        /* Bảng Debug (Console - Cột phải) */
        #log-console { 
            flex: 1; /* Chiếm 1 nửa không gian còn lại */
            height: 364px; /* Chiều cao khớp chính xác với bảng Robot bên trái */
            background: #000; 
            color: #0f0; 
            padding: 15px; 
            border-radius: 15px; 
            border: 2px solid #444;
            overflow-y: scroll; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 0.9em; 
            box-sizing: border-box;
        }

        /* Responsive: Tự động rớt xuống trên dưới nếu màn hình quá nhỏ (như điện thoại) */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            #robot-viewer, #log-console {
                width: 100%;
                flex: none;
            }
            #log-console { height: 250px; }
        }
    </style>
</head>
<body>

    <h2>TRẠM GIÁM SÁT SUMO ROBOT</h2>

    <div class="container">
        <div id="robot-viewer">
            <svg width="300" height="300" viewBox="0 0 200 200">
                <rect x="50" y="50" width="100" height="100" rx="5" fill="#333" stroke="#555" stroke-width="2"/>
                
                <rect id="view-motor-l" class="wheel" x="30" y="65" width="18" height="70" rx="3"/>
                <rect id="view-motor-r" class="wheel" x="152" y="65" width="18" height="70" rx="3"/>

                <circle id="view-e3f-1" class="sensor" cx="75" cy="45" r="7"/> 
                <circle id="view-e3f-2" class="sensor" cx="100" cy="45" r="7"/> 
                <circle id="view-e3f-3" class="sensor" cx="125" cy="45" r="7"/> 
                <circle id="view-e3f-0" class="sensor" cx="45" cy="100" r="7"/> 
                <circle id="view-e3f-4" class="sensor" cx="155" cy="100" r="7"/> 
                <circle id="view-e3f-5" class="sensor" cx="100" cy="155" r="7"/> 

                <rect id="view-line-1" class="line-sensor" x="55" y="55" width="10" height="10"/>
                <rect id="view-line-3" class="line-sensor" x="135" y="55" width="10" height="10"/>
                <rect id="view-line-2" class="line-sensor" x="95" y="55" width="10" height="10"/>
                <rect id="view-line-0" class="line-sensor" x="55" y="135" width="10" height="10"/>
                <rect id="view-line-4" class="line-sensor" x="135" y="135" width="10" height="10"/>
                
                <text id="robot-state-text" x="100" y="105" text-anchor="middle" fill="#777" font-size="12" font-family="Arial" font-weight="bold">WAITING</text>            
            </svg>
        </div>

        <div id="log-console">
            [SYSTEM] Đang chờ kết nối từ ESP32 qua Python Server...<br>
        </div>
    </div>

    <script>
        const socket = io("http://127.0.0.1:5000"); 
        const consoleLog = document.getElementById('log-console');

        socket.on('connect', () => {
            addLog("Đã kết nối thành công tới Server!");
        });

        // XỬ LÝ DỮ LIỆU TELEMETRY TỪ STM32
        socket.on('update_telemetry', (data) => {
            
            data.line.forEach((val, i) => {
                const el = document.getElementById(`view-line-${i}`);
                if (el) {
                    if (val) el.classList.add('active'); 
                    else el.classList.remove('active');
                }
            });

            data.e3f.forEach((val, i) => {
                const el = document.getElementById(`view-e3f-${i}`);
                if (el) {
                    if (val) el.classList.add('active'); 
                    else el.classList.remove('active');
                }
            });

            const wheelL = document.getElementById('view-motor-l');
            const wheelR = document.getElementById('view-motor-r');
            
            if (data.motor_l !== 0) wheelL.classList.add('moving');
            else wheelL.classList.remove('moving');
            
            if (data.motor_r !== 0) wheelR.classList.add('moving');
            else wheelR.classList.remove('moving');
        });

        // XỬ LÝ DỮ LIỆU LOG TRẠNG THÁI (TEXT) & ĐỔI MÀU CHỮ TRÊN ROBOT
        socket.on('update_web_console', (data) => {
            addLog(data.msg);

            // Bắt từ khóa trong Log để đổi trạng thái trên lưng Robot
            const text = data.msg;
            const stateText = document.getElementById('robot-state-text');
            
            if (text.includes("TAN CONG")) {
                stateText.textContent = "ATTACK";
                stateText.setAttribute("fill", "#ff3e3e"); // Đỏ
            } 
            else if (text.includes("SINH TON")) {
                stateText.textContent = "SURVIVAL";
                stateText.setAttribute("fill", "#ffff00"); // Vàng
            } 
            else if (text.includes("PHONG THU")) {
                stateText.textContent = "DEFENSE";
                stateText.setAttribute("fill", "#ff8800"); // Cam
            } 
            else if (text.includes("TÌM KIẾM")) {
                stateText.textContent = "SEARCH";
                stateText.setAttribute("fill", "#00d4ff"); // Xanh dương
            }
        });

        function addLog(msg) {
            const now = new Date().toLocaleTimeString();
            consoleLog.innerHTML += `[${now}] ${msg}<br>`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }
    </script>
</body>
</html>
